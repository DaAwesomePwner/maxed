[package]
autotests = false
name = "maxed-cli"
description = "Headless replay, scrub, and parity tools for Maxed."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
[dependencies]
serde.workspace = true
thiserror.workspace = true
serde_json.workspace = true
sha2.workspace = true
anyhow.workspace = true
crossbeam-channel.workspace = true
ctrlc.workspace = true
maxed-protocol = { path = "../maxed-protocol" }
maxed-recording = { path = "../maxed-recording" }
maxed-capture = { path = "../maxed-capture" }
maxed-stream = { path = "../maxed-stream" }
maxed-engine = { version = "0.1.3", path = "../maxed-engine" }
maxed-assets = { version = "0.1.3", path = "../maxed-assets" }
[dev-dependencies]
serde_json.workspace = true
maxed-store = { path = "../maxed-store" }
[dependencies.maxed-types]
path = "../maxed-types"


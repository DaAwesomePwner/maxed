[workspace]
resolver = "2"
members = ["crates/maxed-types", "crates/maxed-engine", "crates/maxed-store", "crates/maxed-assets", "crates/maxed-capture", "crates/maxed-stream", "crates/maxed-recording", "crates/maxed-protocol", "crates/maxed-cli", "app/src-tauri"]
[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/DaAwesomePwner/maxed"
homepage = "https://github.com/DaAwesomePwner/maxed"
rust-version = "1.99.0"
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
sha2 = "0.10"
tracing = "0.1"
crossbeam-channel = "0.5"
ctrlc = "3"
libloading = "0.8"
ts-rs = { version = "11", features = ["serde-compat"] }

[workspace]
resolver = "2"
members = ["crates/maxed-types", "crates/maxed-engine", "crates/maxed-store", "crates/maxed-assets", "crates/maxed-capture", "crates/maxed-stream", "crates/maxed-recording", "crates/maxed-protocol", "crates/maxed-cli", "app/src-tauri"]
[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/DaAwesomePwner/maxed"
homepage = "https://github.com/DaAwesomePwner/maxed"
rust-version = "1.99.0"
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
sha2 = "0.10"
tracing = "0.1"
crossbeam-channel = "0.5"
ctrlc = "3"
libloading = "0.8"
ts-rs = { version = "11", features = ["serde-compat"] }

# Line tables keep file:line backtraces in workspace code. Full debug info,
# especially for dependencies, mostly slows linking and multiplies target/ size.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Optimize hot storage dependencies to keep dev/test suites fast; workspace code stays unoptimized.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

[profile.dev.package.serde_json]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

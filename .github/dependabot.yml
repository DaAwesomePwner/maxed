{
  "version": 2,
  "updates": [
    {
      "package-ecosystem": "cargo",
      "directory": "/",
      "schedule": {
        "interval": "weekly",
        "day": "monday"
      },
      "open-pull-requests-limit": 5,
      "groups": {
        "cargo-minor-patch": {
          "update-types": [
            "minor",
            "patch"
          ]
        }
      },
      "ignore": [
        {
          "dependency-name": "*",
          "update-types": [
            "version-update:semver-major"
          ]
        }
      ]
    },
    {
      "package-ecosystem": "npm",
      "directory": "/app/ui",
      "schedule": {
        "interval": "weekly",
        "day": "monday"
      },
      "open-pull-requests-limit": 5,
      "groups": {
        "npm-minor-patch": {
          "update-types": [
            "minor",
            "patch"
          ]
        }
      },
      "ignore": [
        {
          "dependency-name": "*",
          "update-types": [
            "version-update:semver-major"
          ]
        },
        {
          "dependency-name": "@tauri-apps/cli"
        }
      ]
    },
    {
      "package-ecosystem": "github-actions",
      "directory": "/",
      "schedule": {
        "interval": "weekly",
        "day": "monday"
      },
      "open-pull-requests-limit": 5,
      "groups": {
        "github-actions-minor-patch": {
          "update-types": [
            "minor",
            "patch"
          ]
        }
      },
      "ignore": [
        {
          "dependency-name": "*",
          "update-types": [
            "version-update:semver-major"
          ]
        }
      ]
    }
  ]
}

{
  "name": "Bug report",
  "description": "Report a problem with Maxed on Windows.",
  "labels": [
    "bug"
  ],
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "**Privacy: never attach raw recordings, .pcap or .pcapng files, live.sqlite3, account details, or other players' names.** Check text and screenshots before posting. A maintainer will ask for a scrubbed capture if needed."
      }
    },
    {
      "type": "input",
      "id": "maxed-version",
      "attributes": {
        "label": "Maxed version",
        "description": "Find the version in Settings."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "windows-version",
      "attributes": {
        "label": "Windows version",
        "description": "Include the edition and build from winver."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "npcap-version",
      "attributes": {
        "label": "Npcap version",
        "description": "Enter the installed version, or say not installed / unknown."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "dropdown",
      "id": "area",
      "attributes": {
        "label": "Area",
        "options": [
          "Home dungeon / realm / Nexus",
          "Runs",
          "Alerts",
          "Settings",
          "Capture / Npcap",
          "Install/update",
          "Other"
        ]
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "steps",
      "attributes": {
        "label": "Steps to reproduce",
        "description": "List the steps that lead to the problem."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "expected",
      "attributes": {
        "label": "Expected behavior"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "actual",
      "attributes": {
        "label": "Actual behavior"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "logs",
      "attributes": {
        "label": "Sanitized logs (optional)",
        "description": "**Privacy: never attach raw recordings, .pcap or .pcapng files, live.sqlite3, account details, or other players' names.** Check text and screenshots before posting. A maintainer will ask for a scrubbed capture if needed."
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "checkboxes",
      "id": "privacy",
      "attributes": {
        "label": "Privacy check",
        "options": [
          {
            "label": "I checked this report and attachments for raw recordings, account details, and player names.",
            "required": true
          }
        ]
      }
    }
  ]
}

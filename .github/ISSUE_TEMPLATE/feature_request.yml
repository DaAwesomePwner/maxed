{
  "name": "Feature request",
  "description": "Suggest an improvement to Maxed.",
  "labels": [
    "enhancement"
  ],
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "Describe the workflow you want to improve. Keep account details and player names out of examples and screenshots."
      }
    },
    {
      "type": "textarea",
      "id": "problem",
      "attributes": {
        "label": "Problem or use case",
        "description": "What are you trying to do, and what gets in the way?"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "proposal",
      "attributes": {
        "label": "Suggested improvement",
        "description": "Describe the behavior you would like."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "alternatives",
      "attributes": {
        "label": "Alternatives considered"
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "textarea",
      "id": "context",
      "attributes": {
        "label": "Additional context"
      },
      "validations": {
        "required": false
      }
    }
  ]
}

{
  "name": "CodeQL",
  "on": {
    "push": {
      "branches": [
        "main"
      ]
    },
    "pull_request": {
      "branches": [
        "main"
      ]
    },
    "schedule": [
      {
        "cron": "23 6 * * 1"
      }
    ]
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "codeql-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}",
    "cancel-in-progress": "${{ github.event_name == 'pull_request' }}"
  },
  "jobs": {
    "analyze": {
      "if": "format('{0}', github.event.repository.private) == 'false'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 45,
      "permissions": {
        "contents": "read",
        "security-events": "write"
      },
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "language": [
            "javascript-typescript",
            "rust"
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Initialize CodeQL",
          "uses": "github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26",
          "with": {
            "languages": "${{ matrix.language }}",
            "build-mode": "none"
          }
        },
        {
          "name": "Analyze",
          "uses": "github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26",
          "with": {
            "category": "/language:${{ matrix.language }}"
          }
        }
      ]
    }
  }
}
